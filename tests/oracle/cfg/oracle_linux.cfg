# Linux-MCU variant of oracle.cfg for the in-loop sim.
# Uses gpiochip0 pin names that the Linux klipper.elf understands.
# Pin numbers are arbitrary unused inputs (the Linux host ignores
# GPIO toggling in sim mode). Must match oracle.cfg kinematics + limits
# so the trajectory is identical.
#
# The [mcu] serial path is a template — regen_fork_inloop.py replaces
# /tmp/klippy_oracle_socket with a per-stem socket path at runtime.
[mcu]
serial: /tmp/klippy_oracle_socket

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 5000
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0

[stepper_x]
step_pin: gpiochip0/gpio9
dir_pin: gpiochip0/gpio10
enable_pin: !gpiochip0/gpio11
microsteps: 32
rotation_distance: 40
endstop_pin: ^gpiochip0/gpio20
position_endstop: 0
position_max: 300
position_min: -3

[stepper_y]
step_pin: gpiochip0/gpio12
dir_pin: gpiochip0/gpio13
enable_pin: !gpiochip0/gpio14
microsteps: 32
rotation_distance: 40
endstop_pin: ^gpiochip0/gpio21
position_endstop: 0
position_max: 302

[stepper_z]
step_pin: gpiochip0/gpio15
dir_pin: gpiochip0/gpio16
enable_pin: !gpiochip0/gpio17
microsteps: 32
rotation_distance: 40
endstop_pin: ^gpiochip0/gpio22
position_min: -5
position_endstop: 0
position_max: 230

# No [extruder] — MotionToolhead falls back to DummyExtruder.
# The oracle G-codes have no E moves so this is fine.

# Input shaper: the oracle comparison operates on pre-shaping move geometry
# (the [bridge-trace] move: lines are dispatched before shaping), so the
# specific shaper parameters don't affect correctness of the comparison.
# We must configure a real shaper_freq_x/y > 0 because the Rust planner's
# init_planner() call rejects 0 Hz. Use smooth_zv @ 50 Hz as a nominal value.
[input_shaper]
shaper_type_x: smooth_zv
shaper_freq_x: 50
shaper_type_y: smooth_zv
shaper_freq_y: 50

# Enables SET_KINEMATIC_POSITION so oracle inputs can fake-home.
[force_move]
enable_force_move: True
