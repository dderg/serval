# Minimal CoreXY config for oracle runs.
# DO NOT confuse with the user's real printer.cfg. This is for
# offline klipper-sim oracle comparison only; nothing here ever
# reaches hardware.
#
# Copy of klipper-sim's test/fixtures/tiny.cfg with no edits, so
# both fork and mainline use the identical input. Update both sides
# together if you change this.
[mcu]
serial: /tmp/klippy_sim_pty

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 5000
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0

[stepper_x]
step_pin: PA5
dir_pin: PA4
enable_pin: !PA1
microsteps: 32
rotation_distance: 40
endstop_pin: ^PB0
position_endstop: 0
position_max: 300
position_min: -3

[stepper_y]
step_pin: PA3
dir_pin: PA2
enable_pin: !PA6
microsteps: 32
rotation_distance: 40
endstop_pin: ^PB1
position_endstop: 0
position_max: 302

[stepper_z]
step_pin: PD7
dir_pin: PD5
enable_pin: !PD3
microsteps: 32
rotation_distance: 40
endstop_pin: ^PB2
position_min: -5
position_endstop: 0
position_max: 230

[extruder]
step_pin: PD4
dir_pin: PD2
enable_pin: !PD1
microsteps: 16
rotation_distance: 22.678
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA7
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300
min_extrude_temp: 0
