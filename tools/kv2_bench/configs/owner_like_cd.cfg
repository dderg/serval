[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f401xc_1800190001504E334B353720-if00

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 50000
minimum_cruise_ratio: 0.5
max_z_velocity: 15
max_z_accel: 500

[stepper_x]
step_pin: PB12
dir_pin: PB13
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PA9
position_endstop: 0
position_max: 350

[stepper_y]
step_pin: PB14
dir_pin: PB15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PA10
position_endstop: 0
position_max: 350

[stepper_z]
step_pin: PB6
dir_pin: PB7
microsteps: 16
rotation_distance: 8
endstop_pin: ^PA15
position_endstop: 0
position_max: 300

[extruder]
step_pin: PB8
dir_pin: PB9
microsteps: 16
rotation_distance: 22.6789511
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 5
max_extrude_only_distance: 200
heater_pin: PA1
sensor_type: temperature_mcu
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300
min_extrude_temp: 0

[gcode_arcs]
resolution: 0.1

[input_shaper]
shaper_type: smooth_mzv
shaper_freq_x: 200
shaper_freq_y: 130

[virtual_sdcard]
path: ~/printer_data/gcodes

[corner_deviation]
