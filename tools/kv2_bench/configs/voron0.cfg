[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f401xc_1800190001504E334B353720-if00

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[gcode_arcs]

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 5.0
minimum_cruise_ratio: 0.1

[stepper_x]
step_pin: PB12
dir_pin: PB13
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^PA9
position_endstop: 121
position_max: 121
homing_positive_dir: true

[stepper_y]
step_pin: PB14
dir_pin: PB15
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^PA10
position_endstop: 120
position_max: 120
homing_positive_dir: true

[stepper_z]
step_pin: PB6
dir_pin: PB7
rotation_distance: 40
gear_ratio: 80:20, 2:1
microsteps: 16
endstop_pin: ^PA15
position_endstop: 116.1
position_max: 120
position_min: -5

[extruder]
step_pin: PB8
dir_pin: PB9
full_steps_per_rotation: 200
microsteps: 16
rotation_distance: 22.095
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150
max_extrude_cross_section: 0.8
pressure_advance_smooth_time: 0.01
linearization_velocity: 1.5
pressure_advance_model: tanh
linear_advance: 0.015
nonlinear_offset: 0.011
heater_pin: PA1
sensor_type: temperature_mcu
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300
min_extrude_temp: 0

[input_shaper]
smoother_freq_x: 112.8
shaper_type_x: smooth_mzv
smoother_freq_y: 90.2
shaper_type_y: smooth_mzv
enabled_extruders: extruder

[gcode_macro PRINT_START]
gcode:
    SET_KINEMATIC_POSITION X=121 Y=120 Z=116.1
    G90
    M83
    G92 E0
    G0 X0 Y0 Z10 F6000
    G1 Z0.28 F240
    G92 E0
    G1 X60 E10 F1500
    G1 Y0.3 F5000
    G92 E0

[gcode_macro PRINT_END]
gcode:
    M400
    G92 E0
    G1 E-4.0 F3600
    G91
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}
    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}
    {% if printer.toolhead.position.z < (max_z - 2) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}
    G0 Z{z_safe} F3600
    G0 X{x_safe} Y{y_safe} F20000
    G90
    G0 X100 Y110 F3600
    M400

[gcode_macro M106]
gcode:
    {% set unused = 0 %}

[gcode_macro M140]
gcode:
    {% set unused = 0 %}
