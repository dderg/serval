# Synthetic printer.cfg for klippy-in-loop sim tests.
#
# Talks to a Linux-host klipper.elf binary built from MACH_LINUX +
# KALICO_RUNTIME, exercising the full engine → runtime path without
# real hardware. NEVER use on a physical printer — pins map to whatever
# the host's gpiochip0 happens to expose; some lines on a Pi 5 (HDMI,
# PMIC, etc.) shouldn't be toggled.

[mcu]
serial: /tmp/klipper_sim_socket

[kinematics]
type: corexy
axis_x: x
axis_y: y
axis_z: z
a_motors: a
b_motors: b
z_motors: z

# X/Y range + homing live on the axis, not the motor. Sim runs with real
# shaping at 50 Hz via [post_processor is_xy] (matches the motion-engine
# harness default in rust/trajectory/src/lib.rs). Setting frequency to 0
# used to be a workaround attempt — that triggered a NaN-laden bell kernel
# (build_smooth_zv_kernel divides by frequency) and a downstream
# BezierPiece::Add same-support panic; the planner now rejects freq <= 0
# at the config boundary.
[axis x]
position_endstop: 0
position_max: 200
endstop_pin: ^gpiochip0/gpio20
homing_speed: 50
post_processors: is_xy

[axis y]
position_endstop: 0
position_max: 200
endstop_pin: ^gpiochip0/gpio21
homing_speed: 50
post_processors: is_xy

[axis z]
position_endstop: 0
position_max: 200
endstop_pin: ^gpiochip0/gpio22
homing_speed: 5

[post_processor is_xy]
type: smooth_zv
frequency_hz: 50

[limit gantry]
axes: x, y
max_velocity: 300
max_accel: 3000

[limit z]
axes: z
max_velocity: 300
max_accel: 3000

[motor a]
drive: stepper
step_pin: gpiochip0/gpio9
dir_pin: gpiochip0/gpio10
enable_pin: !gpiochip0/gpio11
microsteps: 256
rotation_distance: 40
phase_stepping: 1

[tmc5160 a]
spi_bus: spidev0.0
cs_pin: gpiochip0/gpio27
run_current: 1.0
sense_resistor: 0.075

[motor b]
drive: stepper
step_pin: gpiochip0/gpio12
dir_pin: gpiochip0/gpio13
enable_pin: !gpiochip0/gpio14
microsteps: 256
rotation_distance: 40
phase_stepping: 1

[tmc5160 b]
spi_bus: spidev0.0
cs_pin: gpiochip0/gpio26
run_current: 1.0
sense_resistor: 0.075

[motor z]
drive: stepper
step_pin: gpiochip0/gpio15
dir_pin: gpiochip0/gpio16
enable_pin: !gpiochip0/gpio17
microsteps: 16
rotation_distance: 8

# No [extruder] — Motion falls back to DummyExtruder which is enough for
# movement-only tests. Adding a real extruder would force a heater + ADC
# sensor which Linux klipper can't open in the host build.

# Enables SET_KINEMATIC_POSITION so sim tests can fake-home without G28.
[force_move]
enable_force_move: True

