[sources]
motor.resistance: LDO-42STH48-2504AC [DS] ldomotion.com/products/ldo42sth482504ac (1.2 ohm +-20%); ~/Developer/kv2-notes/printer-params.md section 1
motor.inductance: LDO-42STH48-2504AC [DS] ldomotion.com/products/ldo42sth482504ac (1.5 mH +-20%)
motor.holding_torque: LDO-42STH48-2504AC [DS] ldomotion.com/products/ldo42sth482504ac (0.55 N m, read as two phases at rated current)
motor.rated_current: LDO-42STH48-2504AC [DS] ldomotion.com/products/ldo42sth482504ac (2.5 A per phase)
motor.detent_torque: LDO-42STH48-2504AC [DS] ldomotion.com/products/ldo42sth482504ac (20 mN m)
motor.rotor_inertia: LDO-42STH48-2504AC-RevA.pdf drawing (84.5 g cm2) [DS], 3dlabtech.ca/wp-content/uploads/2021/10/LDO-42STH48-2504AC-RevA.pdf
driver.supply_voltage: TMC2209 4.75-29 V [DS]; Voron stock 24 V supply [DOC] (~/Developer/kv2-notes/printer-params.md section 2)
driver.run_current: Voron stock Octopus configs, [tmc2209 stepper_x/y] run_current 0.8 [DOC] (VoronDesign Voron-2 and Voron-Trident Firmware/Octopus configs)
toolhead.mass: Stealthburner + Clockwork 2, 433 g incl. carriage block [COMM] (teamfdm.com/forums/topic/160; ~/Developer/kv2-notes/printer-params.md section 4)
belts.stiffness: [DERIVED] 4 EA / L at mid-travel, the two spans of a tensioned loop in parallel: EA 25.4 kN for 9 mm GT2 (Gates GT3 2MGT Table 6, tension at 0.1% elongation [DS]), loop L 2.4 m (Voron 2.4 350 BOM, 4 x 1200 mm of 9 mm belt for A and B [DOC]); stiffer away from mid-travel
gantry.mass: whole Voron 2.4 350 X gantry, stock 1350 g [COMM] (github.com/Leo-Wolf-the-Engineer/Carbonfiber-X-Axis); its breakdown is not given, taken as excluding the toolhead
local.carriage_mass: ASSUMED, no source: toolhead body fixed to the belts; the remaining 0.1 kg on the local spring is the hotend, its mount and the accelerometer board (E3D Revo hotend 25 g [DOC] is the only cited part of it)
calibration.damping_ratio: at the X resonance; the other modes follow from stiffness-proportional damping. Klipper default damping_ratio 0.1 [DOC]; published CoreXY measurements 0.03-0.10 (~/Developer/kv2-notes/printer-params.md section 6); replace with the owner's SHAPER_CALIBRATE fit
extruder_motor.resistance: LDO-36STH20-1004AHG (Clockwork 2 motor) 2.1 ohm, klipper_tmc_autotune motor_database.cfg [COMM]
extruder_motor.inductance: LDO-36STH20-1004AHG 1.6 mH, klipper_tmc_autotune motor_database.cfg [COMM]
extruder_motor.holding_torque: LDO-36STH20-1004AHG 0.10 N m, klipper_tmc_autotune motor_database.cfg [COMM]
extruder_motor.rated_current: LDO-36STH20-1004AHG 1.0 A, klipper_tmc_autotune motor_database.cfg [COMM]
extruder_motor.detent_torque: ASSUMED, no source: 5 mN m for a 36 mm pancake
extruder_motor.rotor_inertia: ASSUMED, no source: 12 g cm2 for a 36 mm pancake rotor
extruder_motor.damping_ratio: ASSUMED, no source: 0.1 on the extruder rotor's magnetic mode
extruder_driver.supply_voltage: 24 V; 48 V is used on the A/B motors only (MakerMe "Voron on 48V" [COMM])
extruder_driver.run_current: Voron Trident Octopus config [tmc2209 extruder] run_current 0.5 [DOC]
melt.time_constant: inside the cited direct-drive pressure advance range 0.015-0.05 s (Klipper Pressure_Advance.md [DOC], FLY Orbiter references [COMM]); printer_sim sets the planning pressure_advance to it
melt.back_pressure: ASSUMED, no source: 1 N of filament force per mm^3/s of flow (40 N at 40 mm^3/s); printer-params.md has no extruder force data
melt.max_flow: Phaetus Rapido UHF 75 mm^3/s, vendor figure quoted by 3dpblog.com [COMM]; E3D-tested hotends are 13-32
bead.max_width: ASSUMED, no source: 1.0 mm, the melt cannot spread wider than about the nozzle tip flat where the nozzle stops
