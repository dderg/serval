motor.resistance: LDO-42STH48-2504AC [DS] ldomotion.com/products/ldo42sth482504ac (1.2 ohm +-20%); ~/Developer/kv2-notes/printer-params.md section 1
motor.inductance: LDO-42STH48-2504AC [DS] ldomotion.com/products/ldo42sth482504ac (1.5 mH +-20%)
motor.holding_torque: LDO-42STH48-2504AC [DS] ldomotion.com/products/ldo42sth482504ac (0.55 N m, read as two phases at rated current)
motor.rated_current: LDO-42STH48-2504AC [DS] ldomotion.com/products/ldo42sth482504ac (2.5 A per phase)
motor.detent_torque: LDO-42STH48-2504AC [DS] ldomotion.com/products/ldo42sth482504ac (20 mN m)
motor.rotor_inertia: LDO-42STH48-2504AC-RevA.pdf drawing (84.5 g cm2) [DS], 3dlabtech.ca/wp-content/uploads/2021/10/LDO-42STH48-2504AC-RevA.pdf
driver.supply_voltage: 48 V on TMC5160-class drivers (IC 8-60 V [DS]; MakerMe "Voron on 48V" [COMM])
driver.run_current: 0.707 x the 2.5 A rating, within the BTT TMC5160T Pro 3.1 A RMS limit [DOC]
belts.stiffness: ASSUMED pin for interpretation A (user-approved): 3x the 48 V set's reflected magnetic stiffness per motor, K*I*N/r^2 = 0.389 N m * 50 / (6.366e-3 m)^2 = 4.80e5 N/m. It is 34x the Gates-derived 4.2e4 N/m of a 2.4 m 9 mm loop (see the _b files): A needs belts far stiffer than a Voron's
calibration.damping_ratio: at the X resonance; the other modes follow from stiffness-proportional damping. Klipper default damping_ratio 0.1 [DOC]; published CoreXY measurements 0.03-0.10 (~/Developer/kv2-notes/printer-params.md section 6); replace with the owner's SHAPER_CALIBRATE fit
