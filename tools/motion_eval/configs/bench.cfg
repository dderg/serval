[mcu]
serial: /dev/null

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 10000
minimum_cruise_ratio: 0.5
max_z_velocity: 15
max_z_accel: 300

[stepper_x]
step_pin: PA0
dir_pin: PA1
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: PA3
position_endstop: 0
position_max: 350

[stepper_y]
step_pin: PB0
dir_pin: PB1
enable_pin: !PB2
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: PB3
position_endstop: 0
position_max: 350

[stepper_z]
step_pin: PC0
dir_pin: PC1
enable_pin: !PC2
microsteps: 16
rotation_distance: 8
endstop_pin: PC3
position_endstop: 0
position_max: 300

[extruder]
step_pin: PD0
dir_pin: PD1
enable_pin: !PD2
microsteps: 16
rotation_distance: 22.6789511
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 5
max_extrude_only_distance: 200
heater_pin: PD3
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300
min_extrude_temp: 0

[gcode_arcs]
resolution: 0.1

[input_shaper]
shaper_type: mzv
shaper_freq_x: 50
shaper_freq_y: 44
