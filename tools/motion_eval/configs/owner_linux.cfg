[mcu]
serial: /dev/null

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 50000
minimum_cruise_ratio: 0.5
max_z_velocity: 15
max_z_accel: 500

[stepper_x]
step_pin: gpiochip15/gpio0
dir_pin: gpiochip15/gpio1
enable_pin: !gpiochip15/gpio2
microsteps: 4
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: gpiochip15/gpio20
position_endstop: 0
position_max: 350

[stepper_y]
step_pin: gpiochip15/gpio3
dir_pin: gpiochip15/gpio4
enable_pin: !gpiochip15/gpio5
microsteps: 4
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: gpiochip15/gpio21
position_endstop: 0
position_max: 350

[stepper_z]
step_pin: gpiochip15/gpio6
dir_pin: gpiochip15/gpio7
enable_pin: !gpiochip15/gpio8
microsteps: 16
rotation_distance: 8
endstop_pin: gpiochip15/gpio22
position_endstop: 0
position_max: 300

[extruder]
step_pin: gpiochip15/gpio9
dir_pin: gpiochip15/gpio10
enable_pin: !gpiochip15/gpio11
microsteps: 16
rotation_distance: 22.6789511
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 5
max_extrude_only_distance: 200
heater_pin: gpiochip15/gpio12
sensor_type: temperature_host
sensor_path: /sys/class/hwmon/hwmon0/temp1_input
control: watermark
min_temp: 0
max_temp: 300
min_extrude_temp: 0

[gcode_arcs]
resolution: 0.1

[input_shaper]
shaper_type: smooth_mzv
shaper_freq_x: 200
shaper_freq_y: 130
