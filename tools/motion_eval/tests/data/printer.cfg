[mcu]
serial: /dev/null

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 5000
square_corner_velocity: 5
max_z_velocity: 10
max_z_accel: 100

[stepper_x]
step_pin: PA0
dir_pin: PA1
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
endstop_pin: PA3
position_endstop: 0
position_max: 250

[stepper_y]
step_pin: PB0
dir_pin: !PB1
enable_pin: !PB2
microsteps: 16
rotation_distance: 40
endstop_pin: PB3
position_endstop: 0
position_max: 250

[stepper_z]
step_pin: PC0
dir_pin: PC1
enable_pin: !PC2
microsteps: 16
rotation_distance: 8
endstop_pin: PC3
position_endstop: 0
position_max: 200

[input_shaper]
shaper_type: mzv
shaper_freq_x: 50
shaper_freq_y: 40
