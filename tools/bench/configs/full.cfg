[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f401xc_1800190001504E334B353720-if00

[printer]
max_velocity: 1000
max_accel: 10000
max_jerk: 0
corner_deviation: 0.21
max_z_velocity: 25
max_z_accel: 100

[kinematics]
type: corexy
axis_x: x
axis_y: y
axis_z: z
a_motors: a
b_motors: b
z_motors: z

[axis x]
position_min: 0
position_endstop: 0
position_max: 300
endstop_pin: PA9
homing_speed: 20
post_processors: shaper_x

[axis y]
position_min: 0
position_endstop: 0
position_max: 300
endstop_pin: PA10
homing_speed: 20
post_processors: shaper_y

[axis z]
position_min: -5
position_endstop: 0
position_max: 250
endstop_pin: PA15
homing_speed: 5

[axis e]
follows: x, y, z
motors: extruder
post_processors: pa, st

[post_processor pa]
type: linear_pressure_advance
k: 0.03

[post_processor st]
type: smooth_triangle
smooth_time: 0.04

[post_processor shaper_x]
type: smooth_mzv
frequency_hz: 50

[post_processor shaper_y]
type: smooth_zv
frequency_hz: 44

[motor a]
drive: stepper
step_pin: PB12
dir_pin: PB13
microsteps: 16
rotation_distance: 40

[motor b]
drive: stepper
step_pin: PB14
dir_pin: PB15
microsteps: 16
rotation_distance: 40

[motor z]
drive: stepper
step_pin: PB6
dir_pin: PB7
microsteps: 16
rotation_distance: 8

[motor extruder]
drive: stepper
step_pin: PB8
dir_pin: PB9
microsteps: 16
rotation_distance: 7.73

[extruder]
axis: e
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: bench_ntc
sensor_pin: PA4
pullup_resistor: 10000
min_temp: 5
max_temp: 280
min_extrude_temp: 5
control: pid
pid_kp: 30.356
pid_ki: 1.857
pid_kd: 124.081

[virtual_sdcard]
path: ~/printer_data/gcodes

[force_move]
enable_force_move: True

[diag_stepper]

[thermistor bench_ntc]
temperature1: 25
resistance1: 100000
beta: 3000

[heater_bed]
heater_pin: PB5
sensor_type: bench_ntc
sensor_pin: PA5
pullup_resistor: 10000
min_temp: 5
max_temp: 150
control: pid
pid_kp: 60.0
pid_ki: 0.6
pid_kd: 900.0

[fan]
pin: PB3

[probe]
pin: PB0
z_offset: 0.0

[tmc2209 a]
uart_pin: PB10
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[tmc2209 b]
uart_pin: PB10
uart_address: 1
run_current: 0.8
sense_resistor: 0.110

[tmc2209 z]
uart_pin: PB10
uart_address: 2
run_current: 0.8
sense_resistor: 0.110

[tmc2209 extruder]
uart_pin: PB10
uart_address: 3
run_current: 0.5
sense_resistor: 0.110
