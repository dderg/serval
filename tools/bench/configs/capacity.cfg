[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f401xc_1800190001504E334B353720-if00

[printer]
max_velocity: 2500
max_accel: 60000
max_jerk: 0
corner_deviation: 0.21
max_z_velocity: 400
max_z_accel: 15000

[kinematics]
type: corexy
axis_x: x
axis_y: y
axis_z: z
a_motors: a
b_motors: b
z_motors: z

[axis x]
position_min: 0
position_endstop: 0
position_max: 300
endstop_pin: ^PA9
homing_speed: 20
post_processors: shaper_x

[axis y]
position_min: 0
position_endstop: 0
position_max: 300
endstop_pin: ^PA10
homing_speed: 20
post_processors: shaper_y

[axis z]
position_min: -5
position_endstop: 0
position_max: 250
endstop_pin: ^PA15
homing_speed: 5

[axis e]
follows: x, y, z
motors: extruder
max_accel: 20000

[post_processor shaper_x]
type: smooth_mzv
frequency_hz: 50

[post_processor shaper_y]
type: smooth_zv
frequency_hz: 44

[motor a]
drive: stepper
step_pin: PB12
dir_pin: PB13
microsteps: 16
rotation_distance: 40

[motor b]
drive: stepper
step_pin: PB14
dir_pin: PB15
microsteps: 16
rotation_distance: 40

[motor z]
drive: stepper
step_pin: PB6
dir_pin: PB7
microsteps: 16
rotation_distance: 8

[motor extruder]
drive: stepper
step_pin: PB8
dir_pin: PB9
microsteps: 16
rotation_distance: 7.73

[extruder]
axis: e
max_extrude_only_velocity: 400
max_extrude_only_accel: 15000
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: temperature_mcu
min_temp: 0
max_temp: 250
min_extrude_temp: 0
control: pid
pid_kp: 30.356
pid_ki: 1.857
pid_kd: 124.081

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[force_move]
enable_force_move: True

[diag_stepper]
