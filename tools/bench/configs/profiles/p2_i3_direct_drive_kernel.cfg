[mcu]
serial: /dev/null

[printer]
max_velocity: 200
max_accel: 5000
max_jerk: 0
square_corner_velocity: 5
max_z_velocity: 12
max_z_accel: 200

[kinematics]
type: cartesian
axis_x: x
axis_y: y
axis_z: z
x_motors: mx
y_motors: my
z_motors: z

[axis x]
position_min: 0
position_endstop: 0
position_max: 300
endstop_pin: ^PA9
homing_speed: 20
post_processors: shaper_x

[axis y]
position_min: 0
position_endstop: 0
position_max: 300
endstop_pin: ^PA10
homing_speed: 20
post_processors: shaper_y

[axis z]
position_min: -5
position_endstop: 0
position_max: 250
endstop_pin: ^PA15
homing_speed: 5
post_processors: shaper_z

[axis e]
follows: x, y, z
motors: extruder
post_processors: pa, st

[post_processor pa]
type: linear_pressure_advance
k: 0.05

[post_processor st]
type: smooth_triangle
smooth_time: 0.02

[post_processor shaper_x]
type: smooth_mzv
frequency_hz: 55.0

[post_processor shaper_y]
type: smooth_mzv
frequency_hz: 45.0

[post_processor shaper_z]
type: smooth_mzv
frequency_hz: 100.0

[motor mx]
drive: stepper
step_pin: PB12
dir_pin: PB13
microsteps: 16
rotation_distance: 40

[motor my]
drive: stepper
step_pin: PB14
dir_pin: PB15
microsteps: 16
rotation_distance: 40

[motor z]
drive: stepper
step_pin: PB6
dir_pin: PB7
microsteps: 16
rotation_distance: 8

[motor extruder]
drive: stepper
step_pin: PB8
dir_pin: PB9
microsteps: 16
rotation_distance: 7.73

[extruder]
axis: e
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: temperature_mcu
min_temp: 0
max_temp: 250
min_extrude_temp: 0
control: pid
pid_kp: 30.356
pid_ki: 1.857
pid_kd: 124.081
max_extrude_only_velocity: 80
max_extrude_only_accel: 8000

[force_move]
enable_force_move: True
