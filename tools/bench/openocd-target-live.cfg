adapter driver linuxgpiod
adapter gpio swclk 25 -chip 0
adapter gpio swdio 24 -chip 0
transport select swd
source [find target/stm32f4x.cfg]
reset_config none
$_TARGETNAME configure -event reset-start {}
$_TARGETNAME configure -event reset-init {}
$_TARGETNAME configure -event examine-end {}
$_TARGETNAME configure -event gdb-attach {}

proc bench_require_trusted_bus_reads {} {
	set dhcsr [read_memory 0xE000EDF0 32 1]
	if {($dhcsr & 0x00060000) != 0x00020000} {
		error [format "BENCH_CORE_NOT_HALTED_AWAKE: DHCSR 0x%08x" $dhcsr]
	}
	set initial_sp [read_memory 0x08000000 32 1]
	if {$initial_sp != 0x20010000} {
		error [format "BENCH_BUS_READS_UNTRUSTED: flash 0x08000000 reads 0x%08x, not the F401 initial SP 0x20010000" $initial_sp]
	}
	set rcc_cfgr [read_memory 0x40023808 32 1]
	if {($rcc_cfgr & 0x0000000C) != 0x00000008} {
		error [format "BENCH_BUS_READS_UNTRUSTED: RCC_CFGR 0x%08x does not report the PLL as system clock" $rcc_cfgr]
	}
}

proc bench_rmw {address set_bits clear_bits} {
	set before [read_memory $address 32 1]
	mww $address [expr {($before & ~$clear_bits) | $set_bits}]
	echo [format "BENCH_RMW 0x%08x 0x%08x 0x%08x" $address $before [read_memory $address 32 1]]
}

proc bench_while_halted {body} {
	set start [ms]
	set failed [catch {
		halt 100
		bench_require_trusted_bus_reads
		uplevel 1 $body
	} failure]
	if {[catch resume resume_failure]} {
		error "BENCH_RESUME_FAILED: $resume_failure (after: $failure)"
	}
	echo "BENCH_HALT_WINDOW_MS [expr {[ms] - $start}]"
	if {$failed} {
		error $failure
	}
}
