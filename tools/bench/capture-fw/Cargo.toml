[package]
name = "bench-capture-fw"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
stm32f4xx-hal = { version = "0.23.0", features = ["stm32f407", "usb_fs"] }
usb-device = "0.3.2"
usbd-serial = "0.2.2"

[profile.release]
opt-level = 3
debug = true
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
