# Minimal printer config for toolhead jerk integration tests.
# Only the [printer] section is needed — no MCU, no kinematics —
# because the PrinterShim only parses config; it does not instantiate
# the ToolHead object.  The max_jerk key is what we are testing.
[printer]
kinematics: none
max_velocity: 300
max_accel: 5000
max_jerk: 100000
corner_deviation: 0.2
