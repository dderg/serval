# Main configuration file for mkdocs generation of the Kalico documentation.

# Site and directory configuration
site_name: Serval Documentation
site_url: https://alextverdyy.github.io/serval
repo_url: https://github.com/alextverdyy/serval/
repo_name: alextverdyy/serval
edit_uri: edit/sota-motion/docs/
use_directory_urls: False
docs_dir: '../'
site_dir: '../../site/'

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Planning and spec artifacts live under docs/ for editing
# convenience but are intentionally excluded from the published site nav.
not_in_nav: |
  /rewrite/
  /superpowers/
  /human-spec/
  /plans/

# Custom markdown dialect settings
markdown_extensions:
  - toc:
      permalink: True
      toc_depth: 6
  - attr_list
  - mdx_partial_gfm
  - mdx_truly_sane_lists
  - mdx_breakless_lists
  - admonition
plugins:
  search:
    lang: en
  mkdocs-simple-hooks:
    hooks:
      on_page_markdown: "mkdocs_hooks:transform"
  gh-admonitions:
  redirects:
    redirect_maps:
      'Danger_Features.md': 'Kalico_Additions.md'

# Website layout configuration (using mkdocs-material theme)
theme:
  name: material
  logo: logo/kalico-96x96.png
  favicon: logo/kalico-32x32.png
  icon:
    repo: fontawesome/brands/github
    alternate: material/web
  features:
    - navigation.top # back to top button
    - navigation.instant # XHR loading instead of full page reload
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking # url automatically refers to the current paragraph
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - optimize # output optimization
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: deep orange
      toggle:
        icon: material/theme-light-dark
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: yellow
      toggle:
        icon: material/theme-light-dark
        name: Switch to light mode

extra_css:
  - _kalico/css/extra.css

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://kalico.gg/discord
      name: Join our Discord server!
  # Site usage statistics
  # https://squidfunk.github.io/mkdocs-material/setup/setting-up-site-analytics/#site-search-tracking
  analytics:
    provider: google
    property: G-3YZJ9658GV

