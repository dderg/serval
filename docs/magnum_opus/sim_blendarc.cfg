# Minimal simulator config for blend-arc timing measurement
[mcu]
serial: /tmp/klippy_sim_pty

[printer]
kinematics: corexy
max_velocity: 1000
max_accel: 60000
minimum_cruise_ratio: 0.1
corner_deviation: 0.14

[input_shaper]
shaper_freq_x: 185
shaper_freq_y: 117
shaper_type_x: mzv
shaper_type_y: mzv
target_smoothing: 0

[stepper_x]
step_pin: PA5
dir_pin: PA4
enable_pin: !PA1
microsteps: 32
rotation_distance: 40
endstop_pin: ^PB0
position_endstop: 0
position_max: 300
position_min: -3

[stepper_y]
step_pin: PA3
dir_pin: PA2
enable_pin: !PA6
microsteps: 32
rotation_distance: 40
endstop_pin: ^PB1
position_endstop: 0
position_max: 302

[stepper_x1]
step_pin: PC3
dir_pin: PC2
enable_pin: !PB5
microsteps: 32
rotation_distance: 40

[stepper_y1]
step_pin: PC7
dir_pin: PC6
enable_pin: !PB6
microsteps: 32
rotation_distance: 40

[stepper_z]
step_pin: PD7
dir_pin: PD5
enable_pin: !PD3
microsteps: 32
rotation_distance: 40
endstop_pin: ^PB2
position_min: -5
position_endstop: 0
position_max: 230

[extruder]
step_pin: PD4
dir_pin: PD2
enable_pin: !PD1
microsteps: 16
rotation_distance: 22.678
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA7
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300
min_extrude_temp: 0
pressure_advance: 0.04

[heater_bed]
heater_pin: PB3
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: PD0

[gcode_macro PRINT_START]
gcode:
  G28

[gcode_macro PRINT_END]
gcode:
  M84

[gcode_arcs]
