# Bench test macros for the motion-planner rewrite.
#
# Not part of any printer config. Include manually from printer.cfg, e.g.:
#   [include /home/dderg/klipper/config/test-macros.cfg]

[gcode_macro JOG_X_REVERSALS]
description: Relative-mode X back-and-forth jogs. Reversal-pair replan stress test:
  emits all G1s back-to-back with zero gap, forcing multi-move planner windows
  with direction-flip junctions. DIST= mm (30), FEED= mm/min (1500), REPS= (3).
gcode:
    {% set dist = params.DIST|default(30)|float %}
    {% set feed = params.FEED|default(1500)|float %}
    {% set reps = params.REPS|default(3)|int %}
    SAVE_GCODE_STATE NAME=jog_x_reversals
    G91
    {% for _ in range(reps) %}
    G1 X{dist} F{feed}
    G1 X-{dist} F{feed}
    {% endfor %}
    RESTORE_GCODE_STATE NAME=jog_x_reversals
