# Systemd drop-in: keep the klippy host process resident under memory
# pressure.
#
# klippy streams motion pieces to the MCUs ahead of real time; if the
# kernel swaps its pages out (log indexing, GUI, page cache churn on a
# small-RAM host), the next activity burst pays in page faults, piece
# emission stalls for seconds, queued motion arrives in the MCU's past
# (PieceStartInPast) and the run aborts. MemoryMin makes the kernel
# reclaim from every other cgroup first; OOMScoreAdjust keeps the OOM
# killer away from the motion process. Requires cgroup v2 (default on
# Raspberry Pi OS bookworm).
#
# The heartbeat event (subsystem=observability) carries
# mem_available_kb / own_swap_kb / psi_mem_*; a host_memory_pressure
# warning fires when klippy pages get swapped out - if you see it,
# install this drop-in.
#
# Install (adjust the unit name if your klipper service differs):
#   sudo mkdir -p /etc/systemd/system/klipper.service.d
#   sudo cp config/observability/klipper-memory-protection.conf \
#       /etc/systemd/system/klipper.service.d/memory-protection.conf
#   sudo systemctl daemon-reload && sudo systemctl restart klipper
[Service]
MemoryMin=256M
OOMScoreAdjust=-500
