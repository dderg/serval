# Servo calibration macro toolkit (A6-EC over EtherCAT).
#
# Usage: copy next to printer.cfg and add
#   [include servo_calibration.cfg]
#
# Measurement macros home the axis if needed, wrap the strokes in a servo
# capture (.scap lands in ~/printer_data/logs/servo_captures/), and pace
# every stroke with M400 / G4 / M400 so each one replans from idle.
# Drive-parameter macros are thin wrappers over SERVO_PARAM with the A6-EC
# object addresses baked in (CXX.YY lives at 0x20XX.(0xYY+1)).

[gcode_macro _SERVO_STROKES]
description: Internal stroke engine - one accel/speed block of paced strokes
gcode:
  {% set axis = params.AXIS|default('X')|upper %}
  {% set start = params.START|float %}
  {% set end = params.END|float %}
  {% set speed = params.SPEED|float %}
  {% set accel = params.ACCEL|float %}
  {% set iterations = params.ITERATIONS|default(3)|int %}
  {% set dwell = params.DWELL_MS|default(700)|int %}
  {% if end <= start %}
    {action_raise_error("END=%.1f must exceed START=%.1f" % (end, start))}
  {% endif %}
  {% if speed * speed / accel > (end - start) %}
    {action_raise_error("stroke %.0fmm too short to reach %.0fmm/s at %.0fmm/s^2 (needs %.1fmm)"
      % (end - start, speed, accel, speed * speed / accel))}
  {% endif %}
  SET_VELOCITY_LIMIT ACCEL={accel}
  G90
  {% for i in range(iterations) %}
    G1 {axis}{end} F{(speed * 60)|int}
    M400
    G4 P{dwell}
    M400
    G1 {axis}{start} F{(speed * 60)|int}
    M400
    G4 P{dwell}
    M400
  {% endfor %}

[gcode_macro _SERVO_CAL_PREP]
description: Internal - home if needed, settle before capture
gcode:
  {% set axis = params.AXIS|default('X')|upper %}
  {% if axis|lower not in printer.toolhead.homed_axes %}
    G28 {axis}
  {% endif %}
  M400
  G4 P{params.DWELL_MS|default(700)|int}
  M400

[gcode_macro _SERVO_CAL_RESTORE]
description: Internal - restore configured velocity limits
gcode:
  RESET_VELOCITY_LIMIT

[gcode_shell_command servo_tracking_report]
command: ~/klippy-env/bin/python ~/kalico/scripts/servo_capture.py
timeout: 60
verbose: True

[gcode_macro SERVO_MEASURE_TRACKING]
description: Single accel/speed stroke run with capture - the before/after check for any tuning change. Prints per-move following error, overshoot and settling metrics when done. Params AXIS START END SPEED ACCEL ITERATIONS DWELL_MS NAME
gcode:
  {% set axis = params.AXIS|default('X')|upper %}
  {% set start = params.START|default(20)|float %}
  {% set end = params.END|default(200)|float %}
  {% set speed = params.SPEED|default(100)|float %}
  {% set accel = params.ACCEL|default(3000)|float %}
  {% set iterations = params.ITERATIONS|default(3)|int %}
  {% set dwell = params.DWELL_MS|default(700)|int %}
  {% set name = params.NAME|default('track') %}
  _SERVO_CAL_PREP AXIS={axis} DWELL_MS={dwell}
  SERVO_CAPTURE_START AXIS={axis} NAME={name}
  _SERVO_STROKES AXIS={axis} START={start} END={end} SPEED={speed} ACCEL={accel} ITERATIONS={iterations} DWELL_MS={dwell}
  SERVO_CAPTURE_STOP
  _SERVO_CAL_RESTORE
  RUN_SHELL_COMMAND CMD=servo_tracking_report PARAMS="--name {name}"

[gcode_macro SERVO_MEASURE_INERTIA]
description: Excitation grid for the inertia/friction fit (servo-ident). Comma lists ACCELS and SPEEDS, plus AXIS START END ITERATIONS DWELL_MS NAME
gcode:
  {% set axis = params.AXIS|default('X')|upper %}
  {% set start = params.START|default(20)|float %}
  {% set end = params.END|default(200)|float %}
  {% set accels = params.ACCELS|default('5000,10000,20000') %}
  {% set speeds = params.SPEEDS|default('100,400') %}
  {% set iterations = params.ITERATIONS|default(3)|int %}
  {% set dwell = params.DWELL_MS|default(700)|int %}
  {% set name = params.NAME|default('ident') %}
  _SERVO_CAL_PREP AXIS={axis} DWELL_MS={dwell}
  SERVO_CAPTURE_START AXIS={axis} NAME={name}
  {% for a in accels.split(',') %}
    {% for s in speeds.split(',') %}
      _SERVO_STROKES AXIS={axis} START={start} END={end} SPEED={s|trim} ACCEL={a|trim} ITERATIONS={iterations} DWELL_MS={dwell}
    {% endfor %}
  {% endfor %}
  SERVO_CAPTURE_STOP
  _SERVO_CAL_RESTORE

[gcode_shell_command servo_fit_dynamics]
command: ~/klippy-env/bin/python ~/kalico/scripts/servo_fit_dynamics.py
timeout: 120
verbose: True

[gcode_macro SERVO_FIT_DYNAMICS]
description: Identify axis dynamics for torque feedforward. Runs the SERVO_MEASURE_INERTIA excitation grid, fits mass/viscous/coulomb with servo-ident, and writes a new timestamped profile into ~/printer_data/config/servo_dynamics - it never replaces an existing profile, so point dynamics_profile at the file you choose and RESTART. Optional TORQUE_NM + INERTIA_KGM2 add the C00.06 recommendation (the axis rotation_distance is taken from the capture automatically). Params as SERVO_MEASURE_INERTIA plus TORQUE_NM INERTIA_KGM2
gcode:
  {% set name = params.NAME|default('ident') %}
  {% set axis = params.AXIS|default('X')|upper %}
  {% if (params.TORQUE_NM is defined) != (params.INERTIA_KGM2 is defined) %}
    {action_raise_error("TORQUE_NM and INERTIA_KGM2 must be given together")}
  {% endif %}
  SERVO_MEASURE_INERTIA AXIS={axis} START={params.START|default(20)} END={params.END|default(200)} ACCELS={params.ACCELS|default('5000,10000,20000')} SPEEDS={params.SPEEDS|default('100,400')} ITERATIONS={params.ITERATIONS|default(3)} DWELL_MS={params.DWELL_MS|default(700)} NAME={name}
  {% set fit_args = ["--name", name] %}
  {% if params.TORQUE_NM is defined %}
    {% set _ = fit_args.extend(["--rated-torque-nm", params.TORQUE_NM, "--rotor-inertia-kgm2", params.INERTIA_KGM2]) %}
  {% endif %}
  RUN_SHELL_COMMAND CMD=servo_fit_dynamics PARAMS="{fit_args|join(' ')}"

[gcode_macro SERVO_CALIBRATE_INERTIA_RATIO]
description: Step 1 of servo tuning - identify the load inertia and print the recommended C00.06 (the base inertia-ratio gain). Do this BEFORE the loop gains. The printed percentage is the C00.06 value directly - apply it with SERVO_SET_INERTIA_RATIO RATIO=<that number>. TORQUE_NM (motor rated torque, N*m) and INERTIA_KGM2 (rotor inertia, kg*m^2 = the datasheet 10^-4 kg*m^2 value times 1e-4) are REQUIRED, from the motor datasheet. The axis rotation_distance is taken from the capture automatically. Also drops a feedforward profile you can reuse for dynamics_profile later. Params AXIS TORQUE_NM INERTIA_KGM2 START END ACCELS SPEEDS ITERATIONS DWELL_MS NAME
gcode:
  {% set torque = params.TORQUE_NM|default('')|string|trim %}
  {% if torque == '' %}
    {action_raise_error("SERVO_CALIBRATE_INERTIA_RATIO: TORQUE_NM is required - the motor rated torque in N*m (from its datasheet)")}
  {% endif %}
  {% set inertia = params.INERTIA_KGM2|default('')|string|trim %}
  {% if inertia == '' %}
    {action_raise_error("SERVO_CALIBRATE_INERTIA_RATIO: INERTIA_KGM2 is required - the rotor inertia in kg*m^2 (datasheet 10^-4 kg*m^2 value x 1e-4)")}
  {% endif %}
  SERVO_FIT_DYNAMICS AXIS={params.AXIS|default('X')} TORQUE_NM={torque} INERTIA_KGM2={inertia} START={params.START|default(20)} END={params.END|default(200)} ACCELS={params.ACCELS|default('5000,10000,20000')} SPEEDS={params.SPEEDS|default('100,400')} ITERATIONS={params.ITERATIONS|default(3)} DWELL_MS={params.DWELL_MS|default(700)} NAME={params.NAME|default('inertia')}

[gcode_macro SERVO_MEASURE_INERTIA_COREXY]
description: CoreXY excitation grid - one capture of BOTH drives with X and Y strokes at every accel/speed point, so the coupled fit can separate the diagonal and off-diagonal inertia (X strokes excite m_diag+m_off, Y strokes m_diag-m_off). SERVOS is the comma list of the two motor names. Params SERVOS X_START X_END Y_START Y_END ACCELS SPEEDS ITERATIONS DWELL_MS NAME
gcode:
  {% set servos = params.SERVOS|default('stepper_x,stepper_y') %}
  {% set x_start = params.X_START|default(20)|float %}
  {% set x_end = params.X_END|default(200)|float %}
  {% set y_start = params.Y_START|default(20)|float %}
  {% set y_end = params.Y_END|default(200)|float %}
  {% set accels = params.ACCELS|default('5000,10000,20000') %}
  {% set speeds = params.SPEEDS|default('100,400') %}
  {% set iterations = params.ITERATIONS|default(3)|int %}
  {% set dwell = params.DWELL_MS|default(700)|int %}
  {% set name = params.NAME|default('ident') %}
  _SERVO_CAL_PREP AXIS=X DWELL_MS={dwell}
  _SERVO_CAL_PREP AXIS=Y DWELL_MS={dwell}
  SERVO_CAPTURE_START SERVO={servos} NAME={name}
  {% for a in accels.split(',') %}
    {% for s in speeds.split(',') %}
      _SERVO_STROKES AXIS=X START={x_start} END={x_end} SPEED={s|trim} ACCEL={a|trim} ITERATIONS={iterations} DWELL_MS={dwell}
      _SERVO_STROKES AXIS=Y START={y_start} END={y_end} SPEED={s|trim} ACCEL={a|trim} ITERATIONS={iterations} DWELL_MS={dwell}
    {% endfor %}
  {% endfor %}
  SERVO_CAPTURE_STOP
  _SERVO_CAL_RESTORE

[gcode_macro SERVO_CALIBRATE_INERTIA_RATIO_COREXY]
description: Step 1 of CoreXY servo tuning - runs the two-drive X+Y excitation grid, fits the coupled mass matrix, and prints the recommended C00.06 for BOTH directions (the drive takes one scalar, so start from the light-direction number and verify with SERVO_SWEEP_INERTIA). TORQUE_NM and INERTIA_KGM2 are REQUIRED, from the motor datasheet; both motors must be the same model. Params as SERVO_MEASURE_INERTIA_COREXY plus TORQUE_NM INERTIA_KGM2
gcode:
  {% set torque = params.TORQUE_NM|default('')|string|trim %}
  {% if torque == '' %}
    {action_raise_error("SERVO_CALIBRATE_INERTIA_RATIO_COREXY: TORQUE_NM is required - the motor rated torque in N*m (from its datasheet)")}
  {% endif %}
  {% set inertia = params.INERTIA_KGM2|default('')|string|trim %}
  {% if inertia == '' %}
    {action_raise_error("SERVO_CALIBRATE_INERTIA_RATIO_COREXY: INERTIA_KGM2 is required - the rotor inertia in kg*m^2 (datasheet 10^-4 kg*m^2 value x 1e-4)")}
  {% endif %}
  {% set name = params.NAME|default('inertia') %}
  SERVO_MEASURE_INERTIA_COREXY SERVOS={params.SERVOS|default('stepper_x,stepper_y')} X_START={params.X_START|default(20)} X_END={params.X_END|default(200)} Y_START={params.Y_START|default(20)} Y_END={params.Y_END|default(200)} ACCELS={params.ACCELS|default('5000,10000,20000')} SPEEDS={params.SPEEDS|default('100,400')} ITERATIONS={params.ITERATIONS|default(3)} DWELL_MS={params.DWELL_MS|default(700)} NAME={name}
  RUN_SHELL_COMMAND CMD=servo_fit_dynamics PARAMS="--name {name} --structure corexy --rated-torque-nm {torque} --rotor-inertia-kgm2 {inertia}"

[gcode_macro SERVO_MEASURE_FRICTION]
description: Slow constant-speed sweeps for the torque-vs-position friction map. Params AXIS START END SPEED ACCEL ITERATIONS DWELL_MS NAME
gcode:
  {% set axis = params.AXIS|default('X')|upper %}
  {% set start = params.START|default(20)|float %}
  {% set end = params.END|default(200)|float %}
  {% set speed = params.SPEED|default(20)|float %}
  {% set accel = params.ACCEL|default(300)|float %}
  {% set iterations = params.ITERATIONS|default(2)|int %}
  {% set dwell = params.DWELL_MS|default(700)|int %}
  {% set name = params.NAME|default('friction') %}
  _SERVO_CAL_PREP AXIS={axis} DWELL_MS={dwell}
  SERVO_CAPTURE_START AXIS={axis} NAME={name}
  _SERVO_STROKES AXIS={axis} START={start} END={end} SPEED={speed} ACCEL={accel} ITERATIONS={iterations} DWELL_MS={dwell}
  SERVO_CAPTURE_STOP
  _SERVO_CAL_RESTORE

[gcode_macro SERVO_SHOW_TUNING]
description: Read back tuning mode, inertia ratio, gain set 1 and feedforward params from the drive. Param SERVO (required)
gcode:
  {% if params.SERVO is not defined %}
    {action_raise_error("SERVO_SHOW_TUNING: SERVO= is required - name the drive explicitly (e.g. SERVO=y)")}
  {% endif %}
  {% set servo = params.SERVO %}
  RESPOND MSG="C00.04 auto-tuning mode (0=manual 1=stiffness table 2=positioning):"
  SERVO_PARAM SERVO={servo} GET=0x2000.0x05
  RESPOND MSG="C00.05 stiffness level (1..31, used in mode 1):"
  SERVO_PARAM SERVO={servo} GET=0x2000.0x06
  RESPOND MSG="C00.06 load inertia ratio (%):"
  SERVO_PARAM SERVO={servo} GET=0x2000.0x07
  RESPOND MSG="C01.00 position loop gain (0.1 rad/s):"
  SERVO_PARAM SERVO={servo} GET=0x2001.0x01
  RESPOND MSG="C01.01 speed loop gain (0.1 Hz):"
  SERVO_PARAM SERVO={servo} GET=0x2001.0x02
  RESPOND MSG="C01.02 speed integral time (0.01 ms):"
  SERVO_PARAM SERVO={servo} GET=0x2001.0x03
  RESPOND MSG="C01.13 velocity FF source / C01.14 pct (0.1%) / C01.15 filter (Hz):"
  SERVO_PARAM SERVO={servo} GET=0x2001.0x14
  SERVO_PARAM SERVO={servo} GET=0x2001.0x15
  SERVO_PARAM SERVO={servo} GET=0x2001.0x16
  RESPOND MSG="C01.16 torque FF source / C01.17 pct (0.1%) / C01.18 filter (Hz):"
  SERVO_PARAM SERVO={servo} GET=0x2001.0x17
  SERVO_PARAM SERVO={servo} GET=0x2001.0x18
  SERVO_PARAM SERVO={servo} GET=0x2001.0x19

[gcode_macro SERVO_SET_INERTIA_RATIO]
description: Write C00.06 load inertia ratio in percent (fit recommends 37; drive default 100). Params RATIO SERVO (required)
gcode:
  {% if params.SERVO is not defined %}
    {action_raise_error("SERVO_SET_INERTIA_RATIO: SERVO= is required - name the drive explicitly (e.g. SERVO=y)")}
  {% endif %}
  {% set servo = params.SERVO %}
  {% set ratio = params.RATIO|int %}
  {% if not 0 <= ratio <= 12000 %}
    {action_raise_error("RATIO=%d outside C00.06 range 0..12000 (%%)" % ratio)}
  {% endif %}
  SERVO_PARAM SERVO={servo} SET=0x2000.0x07 VALUE={ratio} TYPE=u16

[gcode_macro SERVO_APPLY_GAINS]
description: Switch the drive to manual tuning (C00.04=0) and write gain set 1. POS_GAIN in 0.1 rad/s (400 = 40 rad/s), SPEED_GAIN in 0.1 Hz (250 = 25 Hz), INTEGRAL in 0.01 ms (3184 = 31.8 ms). Defaults are the factory Low preset. Param SERVO (required)
gcode:
  {% if params.SERVO is not defined %}
    {action_raise_error("SERVO_APPLY_GAINS: SERVO= is required - name the drive explicitly (e.g. SERVO=y)")}
  {% endif %}
  {% set servo = params.SERVO %}
  {% set pos_gain = params.POS_GAIN|default(400)|int %}
  {% set speed_gain = params.SPEED_GAIN|default(250)|int %}
  {% set integral = params.INTEGRAL|default(3184)|int %}
  SERVO_PARAM SERVO={servo} SET=0x2000.0x05 VALUE=0 TYPE=u16
  SERVO_PARAM SERVO={servo} SET=0x2001.0x01 VALUE={pos_gain} TYPE=u16
  SERVO_PARAM SERVO={servo} SET=0x2001.0x02 VALUE={speed_gain} TYPE=u16
  SERVO_PARAM SERVO={servo} SET=0x2001.0x03 VALUE={integral} TYPE=u16
  SERVO_SHOW_TUNING SERVO={servo}

[gcode_shell_command servo_gain_report]
command: ~/klippy-env/bin/python ~/kalico/scripts/servo_gain_report.py
timeout: 120
verbose: True

[gcode_macro SERVO_CALIBRATE_GAINS]
description: Gain sweep, shaper-calibrate style. Tests each speed-loop gain in SPEED_GAINS (0.1 Hz units, comma list), deriving position gain and integral from the vendor ratios; one capture per step; then renders a comparison PNG into ~/printer_data/config/servo_calibrate_results and prints a recommendation. Reverts to the first (lowest) gains afterwards. Params SPEED_GAINS AXIS START END SPEED ACCEL ITERATIONS DWELL_MS TAG SERVO
gcode:
  {% set axis = params.AXIS|default('X')|upper %}
  {% set servo = params.SERVO|default(axis|lower) %}
  {% set start = params.START|default(20)|float %}
  {% set end = params.END|default(200)|float %}
  {% set speed = params.SPEED|default(100)|float %}
  {% set accel = params.ACCEL|default(3000)|float %}
  {% set iterations = params.ITERATIONS|default(2)|int %}
  {% set dwell = params.DWELL_MS|default(700)|int %}
  {% set tag = params.TAG|default('cal') %}
  {% set sgains = [] %}
  {% for s in (params.SPEED_GAINS|default('500,650,800,1000')).split(',') %}
    {% set sg = s|trim|int %}
    {% if not 100 <= sg <= 3000 %}
      {action_raise_error("SPEED_GAIN %d outside 100..3000 (0.1 Hz units)" % sg)}
    {% endif %}
    {% set _ = sgains.append(sg) %}
  {% endfor %}
  {% set step_names = [] %}
  _SERVO_CAL_PREP AXIS={axis} DWELL_MS={dwell}
  SERVO_PARAM SERVO={servo} SET=0x2000.0x05 VALUE=0 TYPE=u16
  {% for sg in sgains %}
    {% set pg = (sg * 1.6)|round|int %}
    {% set ig = (1250000 / sg)|round|int %}
    {% set _ = step_names.append("%s_p%d_s%d_i%d" % (tag, pg, sg, ig)) %}
    RESPOND MSG="gain step {loop.index}/{sgains|length}: pos {pg/10} rad/s, speed {sg/10} Hz, Ti {ig/100} ms"
    SERVO_PARAM SERVO={servo} SET=0x2001.0x01 VALUE={pg} TYPE=u16
    SERVO_PARAM SERVO={servo} SET=0x2001.0x02 VALUE={sg} TYPE=u16
    SERVO_PARAM SERVO={servo} SET=0x2001.0x03 VALUE={ig} TYPE=u16
    SERVO_CAPTURE_START SERVO={servo} NAME={step_names[-1]}
    _SERVO_STROKES AXIS={axis} START={start} END={end} SPEED={speed} ACCEL={accel} ITERATIONS={iterations} DWELL_MS={dwell}
    SERVO_CAPTURE_STOP
  {% endfor %}
  {% set sg0 = sgains[0] %}
  RESPOND MSG="sweep done - reverting to first step ({sg0/10} Hz) until you apply the recommendation"
  SERVO_PARAM SERVO={servo} SET=0x2001.0x01 VALUE={(sg0 * 1.6)|round|int} TYPE=u16
  SERVO_PARAM SERVO={servo} SET=0x2001.0x02 VALUE={sg0} TYPE=u16
  SERVO_PARAM SERVO={servo} SET=0x2001.0x03 VALUE={(1250000 / sg0)|round|int} TYPE=u16
  _SERVO_CAL_RESTORE
  RUN_SHELL_COMMAND CMD=servo_gain_report PARAMS="--tag {tag} --steps {step_names|join(',')}"

[gcode_shell_command servo_inertia_report]
command: ~/klippy-env/bin/python ~/kalico/scripts/servo_inertia_report.py
timeout: 120
verbose: True

[gcode_macro SERVO_SWEEP_INERTIA]
description: Empirical inertia sweep, gain-sweep style. Apply your tuned gains first (SERVO_APPLY_GAINS), then this writes each C00.06 load-inertia ratio in RATIOS (percent, comma list), records one capture per step, and renders a comparison PNG into ~/printer_data/config/servo_calibrate_results - read the start/end overshoot to pick the inertia. Reverts to the first (lowest) ratio afterwards. Params RATIOS AXIS START END SPEED ACCEL ITERATIONS DWELL_MS TAG SERVO
gcode:
  {% set axis = params.AXIS|default('X')|upper %}
  {% set servo = params.SERVO|default(axis|lower) %}
  {% set start = params.START|default(20)|float %}
  {% set end = params.END|default(200)|float %}
  {% set speed = params.SPEED|default(100)|float %}
  {% set accel = params.ACCEL|default(3000)|float %}
  {% set iterations = params.ITERATIONS|default(2)|int %}
  {% set dwell = params.DWELL_MS|default(700)|int %}
  {% set tag = params.TAG|default('inertia') %}
  {% set ratios = [] %}
  {% for r in (params.RATIOS|default('40,70,100,130')).split(',') %}
    {% set rv = r|trim|int(-1) %}
    {% if not 0 <= rv <= 12000 %}
      {action_raise_error("ratio %r not an integer in C00.06 range 0..12000 (%%)" % (r|trim))}
    {% endif %}
    {% if rv not in ratios %}
      {% set _ = ratios.append(rv) %}
    {% endif %}
  {% endfor %}
  {% set ratios = ratios|sort %}
  {% set step_names = [] %}
  _SERVO_CAL_PREP AXIS={axis} DWELL_MS={dwell}
  {% for rv in ratios %}
    {% set _ = step_names.append("%s_r%d" % (tag, rv)) %}
    RESPOND MSG="inertia step {loop.index}/{ratios|length}: C00.06 ratio {rv}%"
    SERVO_PARAM SERVO={servo} SET=0x2000.0x07 VALUE={rv} TYPE=u16
    SERVO_CAPTURE_START SERVO={servo} NAME={step_names[-1]}
    _SERVO_STROKES AXIS={axis} START={start} END={end} SPEED={speed} ACCEL={accel} ITERATIONS={iterations} DWELL_MS={dwell}
    SERVO_CAPTURE_STOP
  {% endfor %}
  {% set rv0 = ratios[0] %}
  RESPOND MSG="sweep done - reverting to first ratio ({rv0}%) until you apply your choice with SERVO_SET_INERTIA_RATIO"
  SERVO_PARAM SERVO={servo} SET=0x2000.0x07 VALUE={rv0} TYPE=u16
  _SERVO_CAL_RESTORE
  RUN_SHELL_COMMAND CMD=servo_inertia_report PARAMS="--tag {tag} --steps {step_names|join(',')}"

[gcode_macro SERVO_SET_STIFFNESS]
description: Vendor-table tuning path - switch to standard mode (C00.04=1) and set C00.05 stiffness level 1..31 (factory 12). The drive derives all gain-set-1 values from the level. Params LEVEL SERVO (required)
gcode:
  {% if params.SERVO is not defined %}
    {action_raise_error("SERVO_SET_STIFFNESS: SERVO= is required - name the drive explicitly (e.g. SERVO=y)")}
  {% endif %}
  {% set servo = params.SERVO %}
  {% set level = params.LEVEL|int %}
  {% if not 1 <= level <= 31 %}
    {action_raise_error("LEVEL=%d outside C00.05 range 1..31" % level)}
  {% endif %}
  SERVO_PARAM SERVO={servo} SET=0x2000.0x05 VALUE=1 TYPE=u16
  SERVO_PARAM SERVO={servo} SET=0x2000.0x06 VALUE={level} TYPE=u16
  SERVO_SHOW_TUNING SERVO={servo}
