[printer]
max_velocity: 300
max_accel: 25000
corner_deviation: 0.05
max_jerk: 0

[post_processor shaper]
type: smooth_bell
smooth_time: 0.010

[axis x]
post_processors: shaper

[axis y]
post_processors: shaper

[kinematics]
type: cartesian
axis_x: x
axis_y: y
axis_z: z
x_motors: mx
y_motors: my
z_motors: mz

[motor mx]
drive: stepper

[motor my]
drive: stepper

[motor mz]
drive: stepper

[motor me]
drive: stepper

[axis z]

[axis e]
motors: me
follows: x, y, z
