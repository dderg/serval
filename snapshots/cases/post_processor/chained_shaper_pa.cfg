[printer]
max_velocity: 300
max_accel: 3000
square_corner_velocity: 5
max_jerk: 100000

[post_processor shaper]
type: smooth_bell
smooth_time: 0.02390625

[post_processor pa]
type: linear_pressure_advance
k: 0.04

[axis x]
post_processors: shaper

[axis y]
post_processors: shaper

[axis e]
post_processors: pa

follows: x, y, z
