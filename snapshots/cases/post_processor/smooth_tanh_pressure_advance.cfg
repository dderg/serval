[printer]
max_velocity: 300
max_accel: 3000
square_corner_velocity: 5
max_jerk: 0

[post_processor shaper]
type: smooth_bell
smooth_time: 0.02390625

[post_processor pa]
type: tanh_pressure_advance
linear_advance: 0.01
nonlinear_offset: 0.06
linearization_velocity: 2.0

[post_processor st_e]
type: smooth_bell
smooth_time: 0.02675

[axis x]
post_processors: shaper

[axis y]
post_processors: shaper

[axis e]
post_processors: pa, st_e
follows: x, y, z
