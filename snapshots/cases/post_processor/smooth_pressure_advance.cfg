[printer]
max_velocity: 300
max_accel: 3000
square_corner_velocity: 5
max_jerk: 100000

[post_processor shaper]
type: smooth_mzv
frequency_hz: 40.0

[post_processor pa]
type: linear_pressure_advance
k: 0.04

[post_processor st_e]
type: smooth_zv
frequency_hz: 30.0

[axis x]
post_processors: shaper

[axis y]
post_processors: shaper

[axis e]
post_processors: pa, st_e
follows: x, y, z
