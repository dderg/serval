[printer]
max_velocity: 300
max_accel: 3000
square_corner_velocity: 5
max_jerk: 100000

[post_processor slew]
type: smooth_bell
smooth_time: 0.0015

[post_processor belt]
type: mode_inverse
frequency_hz: 40
damping_ratio: 0.1

[axis x]
post_processors: slew, belt

[axis y]
post_processors: slew, belt
