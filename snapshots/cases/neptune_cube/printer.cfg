[printer]
max_velocity: 100
max_accel: 1000
square_corner_velocity: 8
max_jerk: 0

[extruder]
max_extrude_only_velocity: 100
max_extrude_only_accel: 1000

[kinematics]
type: cartesian
axis_x: x
axis_y: y
axis_z: z
x_motors: mx
y_motors: my
z_motors: mz

[motor mx]
drive: stepper

[motor my]
drive: stepper

[motor mz]
drive: stepper

[motor me]
drive: stepper

[axis x]

[axis y]

[axis z]

[axis e]
motors: me
follows: x, y, z
