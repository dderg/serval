[printer]
max_velocity: 300
max_accel: 3000
square_corner_velocity: 5
max_jerk: 0

[post_processor pa]
type: tanh_pressure_advance
linear_advance: 0.0
nonlinear_offset: 0.06
linearization_velocity: 2.0

[post_processor e_smoothing]
type: smooth_triangle
smooth_time: 0.005

[axis e]
post_processors: pa, e_smoothing

follows: x, y, z
max_velocity: 80
max_accel: 10000
