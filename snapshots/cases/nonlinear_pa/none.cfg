[printer]
max_velocity: 300
max_accel: 3000
square_corner_velocity: 5
max_jerk: 0

[post_processor e_smoothing]
type: smooth_triangle
smooth_time: 0.005

[axis e]
motors: me
post_processors: e_smoothing
follows: x, y, z

[kinematics]
type: cartesian
axis_x: x
axis_y: y
axis_z: z
x_motors: mx
y_motors: my
z_motors: mz

[motor mx]
drive: stepper

[motor my]
drive: stepper

[motor mz]
drive: stepper

[motor me]
drive: stepper

[axis x]

[axis y]

[axis z]
