[printer]
max_velocity: 300
max_accel: 3000
square_corner_velocity: 5
max_jerk: 100000

[post_processor pa]
type: recipr_pressure_advance
linear_advance: 0.0
nonlinear_offset: 0.06
linearization_velocity: 2.0

[axis e]
post_processors: pa, st

follows: x, y, z

[post_processor st]
type: smooth_triangle
smooth_time: 0.02
