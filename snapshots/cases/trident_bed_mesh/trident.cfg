[printer]
max_velocity: 2800
max_accel: 100000
max_jerk: 0
corner_deviation: 0.03

[post_processor bell]
type: smooth_bell
smooth_time: 0.003

[axis x]
post_processors: bell

[axis y]
post_processors: bell

[kinematics]
type: cartesian
axis_x: x
axis_y: y
axis_z: z
x_motors: mx
y_motors: my
z_motors: mz

[motor mx]
drive: stepper

[motor my]
drive: stepper

[motor mz]
drive: stepper

[motor me]
drive: stepper

[axis z]

[axis e]
motors: me
follows: x, y, z
