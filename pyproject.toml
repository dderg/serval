[project]
name = "Kalico"
version = "0.12.1"
requires-python = ">=3.9"
dependencies = [
  "cffi==1.17.1 ; python_version >= '3.13'",
  "cffi==1.15.1 ; python_version < '3.13'",
  "greenlet==3.3 ; python_version >= '3.14'",
  "greenlet==3.1 ; python_version == '3.13'",
  "greenlet==3.0.3 ; python_version == '3.12'",
  "greenlet==2.0.2 ; python_version < '3.12'",
  "Jinja2>=3.1.6",
  "markupsafe==2.1.5",
  "numpy~=2.0 ; python_version=='3.9'",
  "numpy~=2.2 ; python_version>='3.10' and python_version<'3.14'",
  "numpy>=2.3.2 ; python_version>='3.14'",
  "pyserial==3.4",
  "python-can~=4.5",
  "setuptools==75.8.2 ; python_version >= '3.12'", # required by python-can < 4.3
]

[dependency-groups]
dev = [
  "ruff>=0.9.3",
  "pre-commit>=4.0.1",
  "pytest-xdist>=3.6.1",
  "pytest>=8.3.4",
  "basedpyright>=1.21",
]
prototype = [
  "scipy>=1.14 ; python_version>='3.10'",
  "matplotlib>=3.8",
]

[project.urls]
homepage = "https://kalico.gg/"
source = "https://github.com/KalicoCrew/kalico"
documentation = "https://docs.kalico.gg/"
issues = "https://github.com/KalicoCrew/kalico/issues"
funding = "https://docs.kalico.gg/Sponsors.html"

# Typechecking is scoped to the servo calibration modules only — the wider
# klippy estate is untyped legacy and stays out of scope deliberately.
[tool.basedpyright]
include = [
  "klippy/extras/servo_calibration.py",
  "klippy/extras/servo_strokes.py",
  "klippy/extras/servo_tuning.py",
  "klippy/extras/servo_param.py",
  "klippy/extras/servo_capture.py",
]
typeCheckingMode = "standard"
pythonVersion = "3.13"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 80
indent-width = 4
# motors_sync.py is vendored third-party code (see docs/kalico-rewrite/credits.md);
# kept close to upstream for provenance/diffing rather than reformatted to house style.
exclude = ["./.github", "./.history", "./config", "./docs", "./lib", "./src", "./klippy/extras/motors_sync.py"]

[tool.ruff.lint]
extend-select = [
  "B006",  # Checks for uses of mutable objects as function argument defaults
  "FA100", # Detect when type annotations could be made better with PEP563
  "FA102", # Detect type annotations that would require `from __future__ import annotations`
  "I001",  # unsorted-imports: Import block is un-sorted or un-formatted
  "I002",  # missing-required-import: Missing required import: {name}"
]
ignore = [
  "C901", # Function is too complex
  "E501", # Line too long (82 > 79 characters)
  "E302", # Expected 2 blank lines, found 0
  "E722", # Do not use bare except, specify exception instead
  "E741", # Do not use variables named 'I', 'O', or 'l'
  "F841", # Local variable name is assigned to but never used
  "E721", # Do not compare types, use 'isinstance()'
]

[tool.pytest.ini_options]
pythonpath = [".", "klippy", "scripts"]
# NOTE: tools/ is deliberately NOT in testpaths. The CI-able sim unit
# subset is run via an explicit path + marker selection (see
# `scripts/ci.sh sim`), so widening testpaths here would sweep in the
# ELF/hardware tests that must not run in CI. The full-stack sim e2e
# suite runs via `tools/sim/run.sh test` (Docker).
# scripts/ and snapshots/ are listed as explicit files, not whole
# directories: scripts/ also holds scripts/test_klippy.py (a legacy
# optparse-based CLI runner, not a pytest module), which should not be
# swept into this job.
testpaths = [
  "test",
  "tests",
  "snapshots/test_harness.py",
]
markers = [
  "sim_unit: in-process sim unit/contract test (CI-able, no ELF/hardware)",
  "needs_elf: requires the built MACH_LINUX sim ELFs (tools/sim)",
  "needs_hardware: requires real H723/F446/Trident bench hardware",
]
