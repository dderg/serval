[mcu]
serial: /dev/null

[printer]
max_velocity: 300
max_accel: 4000
max_jerk: 0
max_z_velocity: 25
max_z_accel: 200
square_corner_velocity: 8

[kinematics]
type: cartesian
axis_x: x
axis_y: y
axis_z: z
x_motors: x
y_motors: y
z_motors: z

[axis x]
position_min: 0
position_endstop: 0
position_max: 250
endstop_pin: ^gpiochip0/gpio10
homing_speed: 10

[axis y]
position_min: 0
position_endstop: 0
position_max: 250
endstop_pin: ^gpiochip0/gpio11
homing_speed: 10

[axis z]
position_min: -5
position_endstop: 0
position_max: 280
endstop_pin: ^gpiochip0/gpio12
homing_speed: 5

[axis e]
follows: x, y, z
motors: extruder
post_processors: pa
max_accel: 20000

[post_processor pa]
type: linear_pressure_advance
k: 0.03

[motor x]
drive: stepper
step_pin: gpiochip0/gpio0
dir_pin: gpiochip0/gpio1
enable_pin: !gpiochip0/gpio2
microsteps: 16
rotation_distance: 40

[motor y]
drive: stepper
step_pin: gpiochip0/gpio3
dir_pin: gpiochip0/gpio4
enable_pin: !gpiochip0/gpio5
microsteps: 16
rotation_distance: 40

[motor z]
drive: stepper
step_pin: gpiochip0/gpio6
dir_pin: gpiochip0/gpio7
enable_pin: !gpiochip0/gpio8
microsteps: 16
rotation_distance: 8

[motor extruder]
drive: stepper
step_pin: gpiochip0/gpio20
dir_pin: !gpiochip0/gpio21
enable_pin: !gpiochip0/gpio22
microsteps: 16
rotation_distance: 7.73

[extruder]
axis: e
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpiochip0/gpio30
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog0
min_temp: 0
max_temp: 250
min_extrude_temp: 0
control: pid
pid_kp: 30.356
pid_ki: 1.857
pid_kd: 124.081
max_extrude_only_velocity: 50
max_extrude_only_accel: 5000

[virtual_sdcard]
path: /tmp/gcode

[force_move]
enable_force_move: True
