[kinematics]
type = cartesian
axis_x = x
axis_y = y
axis_z = z
x_motors = x
y_motors = y
z_motors = z

[axis x]
position_min = 0
position_endstop = 0
position_max = 200
homing_speed = 10

[axis y]
position_min = 0
position_endstop = 0
position_max = 200
homing_speed = 10

[axis z]
position_min = -5
position_endstop = 0
position_max = 200
homing_speed = 5

[axis e]
follows = x, y, z
motors = extruder
post_processors = fz_pa, fz_kernel
max_accel = 20000
max_velocity = 120

[motor x]
drive = stepper
microsteps = 16
rotation_distance = 40

[motor y]
drive = stepper
microsteps = 16
rotation_distance = 40

[motor z]
drive = stepper
microsteps = 16
rotation_distance = 8

[motor extruder]
drive = stepper
microsteps = 16
rotation_distance = 33.5

[extruder]
axis = e
nozzle_diameter = 0.400
filament_diameter = 1.750

[printer]
max_velocity = 700.0
max_accel = 10297.0
max_jerk = 0
square_corner_velocity = 21.9
max_z_velocity = 10.0
max_z_accel = 30.0

[post_processor fz_pa]
type = linear_pressure_advance
k = 0.0386

[post_processor fz_kernel]
type = smooth_mzv
frequency_hz = 169.4
