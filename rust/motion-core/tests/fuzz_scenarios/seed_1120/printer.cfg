[kinematics]
type = cartesian
axis_x = x
axis_y = y
axis_z = z
x_motors = x
y_motors = y
z_motors = z

[axis x]
position_min = 0
position_endstop = 0
position_max = 250
homing_speed = 10
post_processors = fz_shaper_x

[axis y]
position_min = 0
position_endstop = 0
position_max = 250
homing_speed = 10

[axis z]
position_min = -5
position_endstop = 0
position_max = 280
homing_speed = 5

[axis e]
follows = x, y, z
motors = extruder
max_accel = 20000
post_processors = fz_pa, fz_kernel

[motor x]
drive = stepper
microsteps = 16
rotation_distance = 40

[motor y]
drive = stepper
microsteps = 16
rotation_distance = 40

[motor z]
drive = stepper
microsteps = 16
rotation_distance = 8

[motor extruder]
drive = stepper
microsteps = 16
rotation_distance = 7.73

[extruder]
axis = e
nozzle_diameter = 0.400
filament_diameter = 1.750
max_extrude_only_velocity = 50
max_extrude_only_accel = 5000

[printer]
max_velocity = 1000.0
max_accel = 10000.0
max_jerk = 0
corner_deviation = 0.21
max_z_velocity = 25.0
max_z_accel = 100.0

[post_processor fz_shaper_x]
type = smooth_triangle
smooth_time = 0.0109

[post_processor fz_pa]
type = linear_pressure_advance
k = 0.0793

[post_processor fz_kernel]
type = smooth_bell
smooth_time = 0.035
