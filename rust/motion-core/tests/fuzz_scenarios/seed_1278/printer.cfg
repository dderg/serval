[kinematics]
type = corexy
axis_x = x
axis_y = y
axis_z = z
a_motors = a
b_motors = b
z_motors = z

[axis x]
position_min = 0
position_endstop = 0
position_max = 300
homing_speed = 10

[axis y]
position_min = 0
position_endstop = 0
position_max = 300
homing_speed = 10
post_processors = fz_shaper_y

[axis z]
position_min = -5
position_endstop = 0
position_max = 250
homing_speed = 5

[axis e]
follows = x, y, z
motors = extruder
max_accel = 20000

[motor a]
drive = stepper
microsteps = 16
rotation_distance = 40

[motor b]
drive = stepper
microsteps = 16
rotation_distance = 40

[motor z]
drive = stepper
microsteps = 16
rotation_distance = 8

[motor extruder]
drive = stepper
microsteps = 16
rotation_distance = 7.73

[extruder]
axis = e
nozzle_diameter = 0.400
filament_diameter = 1.750
max_extrude_only_velocity = 50
max_extrude_only_accel = 5000

[printer]
max_velocity = 700.0
max_accel = 1503.0
max_jerk = 0
square_corner_velocity = 23.3
max_z_velocity = 25.0
max_z_accel = 100.0

[post_processor fz_shaper_y]
type = smooth_bell
smooth_time = 0.0117
