[package]
name = "motion-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "PyO3-free core of the motion engine: pump, worker, enqueue, homing."
license.workspace = true

[dependencies]
host-rt = { path = "../host-rt" }
mcu-protocol = { path = "../mcu-protocol" }
trajectory = { path = "../trajectory" }
geometry = { path = "../geometry" }
motion-pipeline = { path = "../motion-pipeline" }
gcode = { path = "../gcode" }
nurbs = { path = "../nurbs" }
runtime = { path = "../runtime" }
crossbeam-channel = "0.5"
libc = "0.2"
arc-swap = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "env-filter", "std", "fmt"] }
tracing-appender = "0.2"
tracing-log = "0.2"
time = { version = "0.3", default-features = false, features = ["formatting", "macros", "std"] }
serde_json = "1"
thiserror = { workspace = true }

[features]
test-support = []

[dev-dependencies]
proptest = "1"
log = "0.4"
mcu-transport = { path = "../mcu-transport" }
host-rt = { path = "../host-rt", features = ["test-harness"] }
motion-core = { path = ".", features = ["test-support"] }
ethercat-rt = { path = "../ethercat-rt" }
serialport = "4"

[lints]
workspace = true
