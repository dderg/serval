[package]
name = "motion-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "PyO3-free core of the motion engine: pump, worker, enqueue, homing."
license.workspace = true

[dependencies]
host-rt = { path = "../host-rt" }
mcu-protocol = { path = "../mcu-protocol" }
trajectory = { path = "../trajectory" }
geometry = { path = "../geometry" }
motion-pipeline = { path = "../motion-pipeline" }
gcode = { path = "../gcode" }
nurbs = { path = "../nurbs" }
runtime = { path = "../runtime" }
planner-config = { path = "../planner-config" }
step-shim = { path = "../step-shim" }
ethercat-rt = { path = "../ethercat-rt" }
crossbeam-channel = "0.5"
tracing = "0.1"
thiserror = { workspace = true }

[features]
test-support = []

[dev-dependencies]
proptest = "1"
host-rt = { path = "../host-rt", features = ["test-harness"] }
motion-core = { path = ".", features = ["test-support"] }
serialport = "4"

[lints]
workspace = true
