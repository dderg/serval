[package]
name = "motion-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "PyO3-free core of the motion engine: pump, worker, enqueue, homing."
license.workspace = true

[dependencies]
checked-cast = { path = "../checked-cast" }
host-rt = { path = "../host-rt" }
mcu-protocol = { path = "../mcu-protocol" }
trajectory = { path = "../trajectory" }
geometry = { path = "../geometry" }
motion-pipeline = { path = "../motion-pipeline" }
planner-config = { path = "../planner-config" }
pipeline-snapshot = { path = "../pipeline-snapshot", optional = true }
nurbs = { path = "../nurbs" }
runtime-contract = { path = "../runtime-contract" }
step-shim = { path = "../step-shim" }
ethercat-setpoint = { path = "../ethercat-setpoint" }
ethercat-setpoint-fill = { path = "../ethercat-setpoint-fill" }
crossbeam-channel = "0.5"
tracing = "0.1"
thiserror = { workspace = true }

[features]
test-support = ["pipeline-snapshot"]

[dev-dependencies]
source-tree = { path = "../source-tree" }
motion-pipeline = { path = "../motion-pipeline", features = ["bench-metrics"] }
config-doc = { path = "../config-doc" }
planner-config = { path = "../planner-config", features = ["doc"] }
ethercat-rt = { path = "../ethercat-rt" }
proptest = "1"
libm = { version = "0.2", default-features = false }
host-rt = { path = "../host-rt", features = ["test-harness"] }
motion-core = { path = ".", features = ["test-support"] }

[lints]
workspace = true
