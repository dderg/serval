[package]
name = "host-rt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Standalone Rust host runtime for kalico — owns USB-CDC fd, drives MCU comms protocol, runs clock-freq estimator and credit-based flow control."
license.workspace = true

[dependencies]
serialport = "4"
libc = "0.2"
# `crc` was on the original plan ingredients list but we hand-roll
# Klipper's bespoke crc16-ccitt-variant in host_io.rs to match the
# Python helper byte-for-byte (see `crc16_ccitt`); the canned crate
# polynomials don't match. Step-7 MVP can revisit if the hand-rolled
# loop becomes a hotspot.
tracing = "0.1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
arc-swap = "1"
time = { version = "0.3", default-features = false, features = ["std"] }
runtime-contract = { path = "../runtime-contract" }
mcu-protocol = { path = "../mcu-protocol" }
mcu-transport = { path = "../mcu-transport" }

[features]
default = []
test-harness = []

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
