[package]
name = "piece-sink-harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host harness that compiles src/piece_sink.c and exercises it (invariants, differential vs the Rust codec, byte-stream fuzz) so the MCU parser is verifiable off-hardware."

[lib]
doctest = false

[build-dependencies]
cc = "1"

[dev-dependencies]
mcu-protocol = { path = "../mcu-protocol" }
