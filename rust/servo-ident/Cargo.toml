[package]
name = "servo-ident"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true

[[bin]]
name = "servo-ident"
path = "src/bin/servo-ident.rs"

[[bin]]
name = "servo-cal"
path = "src/bin/servo-cal.rs"

[dependencies]
libm = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
flate2 = "1"

[lints]
workspace = true
