[package]
name = "servo-ident"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true

[[bin]]
name = "servo-ident"
path = "src/bin/servo-ident.rs"

[[bin]]
name = "servo-cal"
path = "src/bin/servo-cal.rs"

[[bin]]
name = "servo-openapi"
path = "src/bin/servo-openapi.rs"

[dependencies]
flate2 = "1"
libm = { version = "0.2", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
jsonschema = { version = "0.48", default-features = false }

[lints]
workspace = true
