[package]
name = "motion-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "PyO3 binding between klippy (Python) and the Rust motion stack."
license.workspace = true

[lib]
# Must match the #[pymodule] fn name in src/lib.rs. Underscore-prefixed so the
# compiled extension does not shadow the pure-Python wrapper klippy/motion_engine.py.
name = "_motion_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }
host-rt = { path = "../host-rt", features = ["python-engine"] }
mcu-protocol = { path = "../mcu-protocol" }
trajectory = { path = "../trajectory" }
temporal = { path = "../temporal" }
geometry = { path = "../geometry" }
gcode = { path = "../gcode" }
nurbs = { path = "../nurbs", features = ["host"] }
runtime = { path = "../runtime" }
crossbeam-channel = "0.5"
libc = "0.2"
log = "0.4"
arc-swap = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "env-filter", "std", "fmt"] }
tracing-appender = "0.2"
tracing-log = "0.2"
time = { version = "0.3", default-features = false, features = ["formatting", "macros", "std"] }
serde_json = "1"
thiserror = { workspace = true }

[features]
test-support = []
# extension-module leaves libpython symbols undefined (resolved by the host
# process). Test binaries are standalone executables and MUST NOT enable it,
# or the Linux link fails on PyErr_Print. The production cdylib enables it
# via Makefile.rust.
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
rustfft = "6"
heapless = { workspace = true }
mcu-transport = { path = "../mcu-transport" }
# Enables McuHostIo::from_port_skip_identify for the teardown tests
# (engine/tests.rs). Cargo unions this with the normal-dep feature set when
# building tests, so the production cdylib build is unaffected.
host-rt = { path = "../host-rt", features = ["python-engine", "test-harness"] }
motion-engine = { path = ".", features = ["test-support"] }
serialport = "4"

[lints]
workspace = true
