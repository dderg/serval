[package]
name = "motion-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "PyO3 binding between klippy (Python) and the Rust motion stack."
license.workspace = true

[lib]
# Must match the #[pymodule] fn name in src/lib.rs. Underscore-prefixed so the
# compiled extension does not shadow the pure-Python wrapper klippy/motion_engine.py.
name = "_motion_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39", "multiple-pymethods"] }
motion-core = { path = "../motion-core" }
ethercat-setpoint = { path = "../ethercat-setpoint" }
ethercat-setpoint-fill = { path = "../ethercat-setpoint-fill" }
motion-services = { path = "../motion-services" }
host-rt = { path = "../host-rt" }
mcu-protocol = { path = "../mcu-protocol" }
trajectory = { path = "../trajectory" }
geometry = { path = "../geometry" }
motion-pipeline = { path = "../motion-pipeline" }
snapshot-core = { path = "../pipeline-snapshot", package = "pipeline-snapshot", optional = true }
runtime-contract = { path = "../runtime-contract" }
config-doc = { path = "../config-doc" }
planner-config = { path = "../planner-config", features = ["doc"] }
crossbeam-channel = "0.5"
libc = "0.2"
tracing = "0.1"
serde_json = "1"
thiserror = { workspace = true }

[features]
snapshot = ["dep:snapshot-core"]
# extension-module leaves libpython symbols undefined (resolved by the host
# process). Test binaries are standalone executables and MUST NOT enable it,
# or the Linux link fails on PyErr_Print. The production cdylib enables it
# via Makefile.rust.
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
motion-core = { path = "../motion-core", features = ["test-support"] }
mcu-transport = { path = "../mcu-transport" }
ethercat-rt = { path = "../ethercat-rt" }
host-rt = { path = "../host-rt", features = ["test-harness"] }
serialport = "4"

[lints]
workspace = true
