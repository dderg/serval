[package]
name = "ethercat-rt"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true

[lib]
name = "ethercat_rt"
crate-type = ["rlib"]

# `hw` gates the EtherCAT FFI (`ffi` module) and the build.rs compile + link of a
# master backend over the shared ec_rt_* surface. OFF by default so the pure
# scale/wire/curves unit tests build and run on any machine (and in CI) without a
# master library installed. `--features hw` builds the SOEM backend (csrc/libecrt.c,
# -lsoem); `--features igh` (implies hw) builds the IgH backend (csrc/libecrt_igh.c,
# -lethercat) — the migration target. igh wins when both are present.
[features]
default = []
hw = []
igh = ["hw"]

# The endpoint binary drives real hardware via the FFI; it only exists with `hw`.
[[bin]]
name = "ethercat-rt"
path = "src/bin/ethercat-rt.rs"
required-features = ["hw"]

# The test client speaks the socket protocol only (no FFI) — builds without `hw`.
[[bin]]
name = "ec-test-client"
path = "src/bin/ec-test-client.rs"

# No-hardware stub: serves the kalico-native socket and answers the protocol
# without driving EtherCAT. For drive-off integration testing. No `hw` feature.
[[bin]]
name = "ethercat-rt-stub"
path = "src/bin/ethercat-rt-stub.rs"

[dependencies]
runtime = { path = "../runtime", default-features = false, features = ["host"] }  # servo node: no stepper dispatch
mcu-protocol = { path = "../mcu-protocol" }
mcu-transport = { path = "../mcu-transport" }
libc = "0.2"                                       # raw clock_gettime(CLOCK_MONOTONIC)
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-dependencies]
cc = "1"                                            # compiles csrc/libecrt.c under `hw`

[dev-dependencies]
host-rt = { path = "../host-rt" }
servo-ident = { path = "../servo-ident" }

[lints]
workspace = true
