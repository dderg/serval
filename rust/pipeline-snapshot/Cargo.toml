[package]
name = "pipeline-snapshot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Headless snapshot of the streaming motion pipeline: waypoints in, exact continuous carriers and seam metrics out. Shared by the PyO3 binding and WASM playground."
license.workspace = true

[dependencies]
crossbeam-channel = "0.5"
gcode = { path = "../gcode" }
geometry = { path = "../geometry" }
motion-pipeline = { path = "../motion-pipeline" }
nurbs = { path = "../nurbs" }
planner-config = { path = "../planner-config" }
serde = { version = "1", features = ["derive"] }
thiserror = { workspace = true }
trajectory = { path = "../trajectory" }

[dev-dependencies]
libm = { version = "0.2", default-features = false }
proptest = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
tracing = "0.1"

[lints]
workspace = true
