[package]
name = "config-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "PyO3 binding exposing config-doc to klippy as _config_doc."
license.workspace = true

[lib]
# Must match the #[pymodule] fn name in src/lib.rs. Underscore-prefixed like
# _motion_engine; klippy/configfile.py imports it as klippy._config_doc.
name = "_config_doc"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }
config-doc = { path = "../config-doc" }
planner-config = { path = "../planner-config", features = ["doc"] }

[features]
# extension-module leaves libpython symbols undefined (resolved by the host
# process); enabled by Makefile.rust for the production cdylib only.
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true
