# Nextest configuration for the kalico Rust workspace.
#
# Honesty principles:
#   - retries = 0: no retry-masking of flaky tests; every failure is surfaced
#   - fail-fast = false: see all failures in one run, not just the first
#   - final-status-level = "fail": report only the failures in the final summary
#   - status-level = "slow": live output carries failures, retries and
#     slow-test warnings only — a green run is one summary line instead of one
#     PASS line per test (~2400 for the workspace)
#   - slow-timeout: warn after 60s, terminate after 3 warnings (180s total)

[profile.default]
retries = 0
fail-fast = false
final-status-level = "fail"
status-level = "slow"

[profile.default.slow-timeout]
period = "60s"
terminate-after = 3

# Real threads, a sleeping dispatcher and the real pacer: the first phase
# assumes the submitter and planner keep a stream 2x ahead of realtime, which
# a machine at load average ~90 cannot do, and a starved producer is rightly
# braked ("parks: 1, busy: 0, idle: 1"). Without a virtual clock threaded
# through the worker threads the premise is the machine's, so this one test
# retries twice; nextest reports it flaky, not green.
[[profile.default.overrides]]
filter = "test(=worker::tests::a_busy_stream_falling_behind_its_playhead_brakes_before_running_dry)"
retries = 2

# `scripts/corpus.sh` plans 402 whole prints in one test (~140 s on an idle
# workstation, ~200 s with the fit audit on, several times that under load).
[[profile.default.overrides]]
filter = "binary(corpus_plans)"
slow-timeout = { period = "60s", terminate-after = 20 }

# CI profile: identical honesty constraints with a tighter slow-timeout to
# surface hanging tests quickly without masking real failures via retries.
[profile.ci]
retries = 0
fail-fast = false
final-status-level = "fail"
status-level = "slow"

[profile.ci.slow-timeout]
period = "60s"
terminate-after = 3

# Real threads, a sleeping dispatcher and the real pacer: the first phase
# assumes the submitter and planner keep a stream 2x ahead of realtime, which
# a machine at load average ~90 cannot do, and a starved producer is rightly
# braked ("parks: 1, busy: 0, idle: 1"). Without a virtual clock threaded
# through the worker threads the premise is the machine's, so this one test
# retries twice; nextest reports it flaky, not green.
[[profile.ci.overrides]]
filter = "test(=worker::tests::a_busy_stream_falling_behind_its_playhead_brakes_before_running_dry)"
retries = 2

# The fit audit replays a whole dense print per test (~65 s on an idle
# runner, over 180 s on a loaded workstation, where the default limit killed
# the kernel-chain test in `ci.sh quick`).
[[profile.ci.overrides]]
filter = "binary(fit_tolerance)"
slow-timeout = { period = "60s", terminate-after = 10 }

# Nightly property suites run ten times the PR case count and exceed the ci
# profile's 180 s limit (seven to nine of them timed out on every nightly run
# so far). Only a test running for half an hour is terminated.
[profile.nightly]
retries = 0
fail-fast = false
final-status-level = "fail"
status-level = "slow"

[profile.nightly.slow-timeout]
period = "300s"
terminate-after = 6

# The path-accuracy audit plans two whole prints per machine profile.
[[profile.default.overrides]]
filter = "binary(path_accuracy)"
slow-timeout = { period = "60s", terminate-after = 15 }
