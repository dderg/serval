language = "C"
header = """\
/*\n\
 * runtime.h — generated by cbindgen.\n\
 * DO NOT EDIT. Regenerate via `cargo run -p c-api --bin gen-headers`.\n\
 */\n"""

include_guard = "RUNTIME_H"
pragma_once = true
no_includes = false

[export]
exclude = [
    # Engine<P, I> is a 2-param generic; cbindgen 0.29 panics on
    # monomorphization. Engine is never directly exposed in the C header.
    "Engine",
]

[fn]
sort_by = "Name"

[parse]
parse_deps = true
include = ["runtime", "c-api"]
