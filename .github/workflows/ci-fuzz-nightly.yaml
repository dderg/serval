name: Property suites (nightly)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      cases:
        description: PROPTEST_CASES per property
        default: '200000'
        required: false

# Same gate as the PR workflow's rust-fuzz job, ten times deeper and on a
# fresh random seed every night. A failure prints the `cc <seed>` line
# proptest needs to replay it: paste it into the suite's
# proptest-regressions/<name>.txt and the case reruns first, forever.

jobs:
  rust-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\n' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=15 install -y libudev-dev lld
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: test
      - name: property suites
        env:
          PROPTEST_CASES: ${{ github.event.inputs.cases || '200000' }}
        run: ./scripts/ci.sh rust-fuzz
