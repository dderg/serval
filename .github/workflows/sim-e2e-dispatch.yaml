name: Sim e2e (dispatch)

# On-demand fan-out: one runner per requested test item, so arbitrary
# subsets of the sim suite run fully parallel on the same commit without
# the local core-count / real-clock-contention limits. Fired by
# tools/sim/ci-run.sh (or manually via gh workflow run).
on:
  workflow_dispatch:
    inputs:
      tests:
        description: >-
          Comma-separated test items, one runner each. An item containing
          ".py" or "::" is a pytest target (bare filenames resolve under
          tools/sim/tests/); anything else is a pytest -k expression.
        required: true
        type: string

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - id: split
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          matrix=$(jq -cn --arg s "$TESTS" \
            '[$s | split(",")[] | gsub("^\\s+|\\s+$"; "") | select(length > 0)]')
          [ "$matrix" != "[]" ] || { echo "no test items in input" >&2; exit 1; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  sim:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: sim (${{ matrix.item }})
    steps:
      - uses: actions/checkout@v4
      - name: Run sim tests
        env:
          ITEM: ${{ matrix.item }}
        run: |
          case "$ITEM" in
            *.py*|*::*)
              if [[ "$ITEM" != */* ]]; then
                ITEM="tools/sim/tests/$ITEM"
              fi
              SIM_TEST_TARGETS="$ITEM" ./scripts/ci.sh sim-e2e
              ;;
            *)
              ./scripts/ci.sh sim-e2e -k "$ITEM"
              ;;
          esac
