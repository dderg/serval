name: Bench firmware

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      bench: ${{ steps.filter.outputs.bench }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            bench:
              - 'tools/bench/**'
              - 'rust/**'
              - 'snapshots/**'
              - 'klippy/**'
              - 'Makefile.rust'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'scripts/ci.sh'
              - '.github/workflows/ci-bench-fw.yaml'

  bench-fw:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\n' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=15 install -y libudev-dev lld
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/bench/capture-fw
            rust
          key: bench-fw
      - name: capture-fw fmt, clippy, build; snapshot engine; tools/bench tests
        # The crate's rust-toolchain.toml pins the toolchain, target and
        # components; job_bench_fw in scripts/ci.sh installs it. It builds
        # the snapshot engine the analyzer tests need: they fail without it.
        run: ./scripts/ci.sh bench-fw
