name: Bench firmware

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bench: ${{ steps.filter.outputs.bench }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            bench:
              - 'tools/bench/**'
              - 'scripts/ci.sh'
              - '.github/workflows/ci-bench-fw.yaml'

  bench-fw:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/bench/capture-fw
          key: bench-fw
      - name: capture-fw fmt, clippy, build; tools/bench tests
        # The crate's rust-toolchain.toml pins the toolchain, target and
        # components; job_bench_fw in scripts/ci.sh installs it. The
        # engine-dependent analyzer tests skip without the snapshot engine.
        run: ./scripts/ci.sh bench-fw
