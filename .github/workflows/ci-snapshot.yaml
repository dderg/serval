name: Snapshot tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'rust/rust-toolchain.toml'
      - '.github/workflows/ci-rust-runtime.yaml'
      - '.github/workflows/ci-snapshot.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      snapshot: ${{ steps.filter.outputs.snapshot }}
      parity: ${{ steps.filter.outputs.parity }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            snapshot:
              - 'rust/**'
              - 'snapshots/**'
              - 'klippy/arc_fit_config.py'
              - 'klippy/configfile.py'
              - 'scripts/viz_pipeline.py'
              - 'scripts/ci.sh'
              - 'Makefile.rust'
              - '.github/workflows/ci-snapshot.yaml'
            parity:
              - 'rust/**'
              - 'snapshots/**'
              - 'klippy/**'
              - 'tools/bench/configs/**'
              - 'tools/bench/printer.cfg'
              - 'tools/sim/gcode/**'
              - 'scripts/ci.sh'
              - 'Makefile.rust'
              - 'pyproject.toml'
              - '.github/workflows/ci-snapshot.yaml'

  snapshot:
    needs: changes
    if: needs.changes.outputs.snapshot == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\n' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=15 install -y libudev-dev lld
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: snapshot-${{ hashFiles('rust/Cargo.toml') }}
      - name: snapshot tests
        run: ./scripts/ci.sh snapshot
        env:
          SNAPSHOT_RESULTS_DIR: ${{ runner.temp }}/snapshot-dump
      - name: upload changed snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: changed-snapshots
          path: ${{ runner.temp }}/snapshot-dump/
          if-no-files-found: ignore

  live-parity:
    needs: changes
    if: needs.changes.outputs.parity == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\n' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=15 install -y libudev-dev lld
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: snapshot-${{ hashFiles('rust/Cargo.toml') }}
      - name: live/snapshot parity
        run: ./scripts/ci.sh live-parity
