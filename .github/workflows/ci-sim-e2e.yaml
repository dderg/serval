name: Sim e2e

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  SIM_IMAGE_ARCHIVE: ${{ github.workspace }}/sim-image.tar.zst

jobs:
  sim-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the sim image once
        run: ./scripts/ci.sh sim-image
      - uses: actions/upload-artifact@v4
        with:
          name: sim-image
          path: sim-image.tar.zst
          compression-level: 0
          retention-days: 1

  sim-e2e:
    needs: sim-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Shards run on separate runners, balanced by measured test-file
      # duration. The fallback "rest" shard ignores every pinned file, so
      # new test files run there without touching this matrix.
      matrix:
        include:
          - shard: probe
            targets: tools/sim/tests/test_probe.py
          - shard: print
            targets: >-
              tools/sim/tests/test_neptune_print.py
              tools/sim/tests/test_print.py
              tools/sim/tests/test_first_extrude.py
              tools/sim/tests/test_print_pressure.py
          - shard: beacon
            targets: >-
              tools/sim/tests/test_beacon.py
              tools/sim/tests/test_beacon_scan_path.py
              tools/sim/tests/test_bed_mesh_transform.py
          - shard: rest-pinned
            targets: >-
              tools/sim/tests/test_heaters_fans.py
              tools/sim/tests/test_phase_stepping.py
              tools/sim/tests/test_probe_calibrate.py
          - shard: rest-slow
            targets: >-
              tools/sim/tests/test_clock_estimate.py
              tools/sim/tests/test_cartographer.py
              tools/sim/tests/test_stepper_enable_print_end.py
              tools/sim/tests/test_homing_pressed_endstop.py
              tools/sim/tests/test_homing_multi_endstop.py
          - shard: rest
            targets: >-
              tools/sim/tests
              --ignore=tools/sim/tests/test_clock_estimate.py
              --ignore=tools/sim/tests/test_cartographer.py
              --ignore=tools/sim/tests/test_stepper_enable_print_end.py
              --ignore=tools/sim/tests/test_homing_pressed_endstop.py
              --ignore=tools/sim/tests/test_homing_multi_endstop.py
              --ignore=tools/sim/tests/test_probe.py
              --ignore=tools/sim/tests/test_neptune_print.py
              --ignore=tools/sim/tests/test_print.py
              --ignore=tools/sim/tests/test_first_extrude.py
              --ignore=tools/sim/tests/test_print_pressure.py
              --ignore=tools/sim/tests/test_beacon.py
              --ignore=tools/sim/tests/test_beacon_scan_path.py
              --ignore=tools/sim/tests/test_bed_mesh_transform.py
              --ignore=tools/sim/tests/test_heaters_fans.py
              --ignore=tools/sim/tests/test_phase_stepping.py
              --ignore=tools/sim/tests/test_probe_calibrate.py
    name: sim-e2e (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sim-image
      - name: Run the sim e2e suite
        run: ./scripts/ci.sh sim-e2e
        env:
          SIM_TEST_TARGETS: ${{ matrix.targets }}
